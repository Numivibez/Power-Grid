<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="fuel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="zap-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" stroke="#27272a" stroke-width="8" />

  <!-- Fuel pump icon -->
  <path d="M120 140 C120 115 140 96 165 96 L275 96 C300 96 320 115 320 140 L320 400 C320 410 310 420 300 420 L140 420 C130 420 120 410 120 400 Z" fill="url(#fuel-grad)" />

  <!-- Station window display -->
  <rect x="150" y="140" width="140" height="90" rx="16" fill="#09090b" stroke="#3f3f46" stroke-width="6" />

  <!-- Fuel nozzle and hose -->
  <path d="M320 180 C360 180 390 210 390 260 L390 340 C390 370 370 390 350 390" fill="none" stroke="#ea580c" stroke-width="24" stroke-linecap="round" />
  <path d="M350 220 L390 180 L420 180" fill="none" stroke="#f97316" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

  <!-- High-voltage Lightning / CNG energy accent -->
  <polygon points="230,150 190,200 220,200 200,240 250,185 220,185" fill="url(#zap-grad)" />

  <!-- Status indicator dot (Live 🟢) -->
  <circle cx="220" cy="360" r="28" fill="#22c55e" stroke="#14532d" stroke-width="6" />
</svg>
